[project]
name = "agentic-evaluator"
version = "0.1.0"
description = "Agentic evaluator grader for CORAL: spawns a Claude evaluator agent with Playwright MCP to score live frontends against task-configurable criteria."
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_evaluator"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentic_evaluator/templates" = "agentic_evaluator/templates"
