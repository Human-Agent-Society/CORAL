# UI-Bench task 6 — Fellowship Intake Portal (Marketing/Landing, Webapp)
# GENERATED by examples/uibench/make_task.py. Do not hand-edit.
#
# Arm: adaptive. The `task:` block is a pure function of the UI-Bench row and is
# byte-identical across all three arms; only grader.args.evolution differs, and
# grader.hide_args keeps that out of the config agents can read.
#
# Prompt source: AfterQuery/ui-bench "UI-Bench%20Prompts%20-%20Main.csv" at revision
#   3a8ec80d04b1498fbf12d275bbc5717413841015
# Source file sha256: a36f5e1ac51c5d8cb72f33fe78df539babb5a8976f906b0cdc96cd896361c51d (fetched and verified by make_task.py, not redistributed)
# Excluded from the ten confirmatory tasks — pilot use only.

task:
  name: "Rijksstudio voor Moderne Kunst"
  description: |
    Create a website for a Dutch contemporary art museum, the
    "Rijksstudio voor Moderne Kunst" in Rotterdam.

    **The form is yours.** A poster, a spatial experience, a single
    interaction — anything that serves the museum's identity.

    Entry point: index.html in the repo.
  tips: |
    - You have the `frontend-design` skill. Use it before writing any code.
    - After each eval, decide: refine or pivot. A pivot means a fundamentally
      different page, not a CSS rewrite.
    - Read the grading feedback for the criteria actually applied to your
      latest attempt before deciding what to change.

grader:
  entrypoint: agentic_evaluator.evolution:EvolvingAgenticEvaluator
  setup:
    # cwd for setup commands is this config's directory.
    - uv pip install -e ../../frontend-eval/grader
  timeout: 1500
  direction: maximize
  hide_args: true
  parallel:
    max_workers: 4
  args:
    evaluator_model: claude-sonnet-4-5
    evaluator_max_turns: 80
    serve_port: 0
    session_persistent: false
    evaluation_instructions: |
      The page is at {url}. Navigate it, take screenshots, test the required
      interactions, then score each criterion with concrete evidence cited.
      Save every screenshot into {scratch_dir} with a descriptive filename.

      Score each criterion from 0 to 1. 0 is absent or unusable performance, 0.5 is partial performance with material deficiencies, and 1 is complete and high-quality performance supported by concrete browser or code evidence.
    evolution:
      # Adaptive arm: the proposer is invoked at fixed checkpoints on the
      # scored-observation clock and shown the last `window` scored attempts
      # (feedback, staged artifacts, agents' notes). Whether and what it
      # publishes depends on the trajectory; when it looks does not.
      mode: adaptive
      checkpoints: [8, 12, 16]
      max_criteria: 11
      # Real-attempt bound, not the schedule: a checkpoint can never publish
      # with no attempts left to be exposed to.
      latest_publication_attempt: 19
      window: 3
      max_new_criteria_per_round: 2
      # Every admitted criterion carries the seed weight, so the arms differ in
      # what criteria say, not in how much they count.
      expansion_weight: 1.0
      # The proposer is a separate role from the online evaluator: a stronger
      # model may propose without changing the judge that produces the score
      # trajectory both arms are measured against.
      proposer_model: claude-opus-5
      proposer_timeout: 600
      agent_notes_enabled: true
      agent_notes_char_budget: 4000
      max_evaluation_retries: 1
    criteria:
      - name: "Build Smoothness"
        weight: 1.0
        description: |
          The project installs, launches, and renders through the standard command without fatal build, runtime, or console errors.
      - name: "Implementation Quality"
        weight: 1.0
        description: |
          The code and state-management approach are coherent, maintainable, and appropriate for the required behavior.
      - name: "Instruction Following"
        weight: 1.0
        description: |
          The artifact satisfies the explicit scenario, goal, vibe, constraints, and common experimental instruction.
      - name: "Visual Quality"
        weight: 1.0
        description: |
          Layout, hierarchy, typography, color, spacing, consistency, and responsive behavior support a polished client-facing result.
      - name: "Interaction Experience"
        weight: 1.0
        description: |
          Required controls and workflows operate predictably, communicate state, prevent avoidable errors, and permit recovery.

agents:
  count: 4
  runtime: claude_code
  model: claude-sonnet-4-5
  max_turns: 400
  research: false
  skills:
    - "../../frontend-eval/skills/frontend-design"

workspace:
  repo_path: ../../frontend-eval/seed

run:
  session: local
  stop:
    max_real_attempts: 24
