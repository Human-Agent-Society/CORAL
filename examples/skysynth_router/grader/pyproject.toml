[project]
name = "skysynth-router-grader"
version = "0.1.0"
description = "CORAL grader for the SkySynth two-tenant LLM-router task: trusted replay, sandboxed candidate process, fixed and evolved executable checks."
requires-python = ">=3.11"
dependencies = [
    "coral",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skysynth_router_grader"]
