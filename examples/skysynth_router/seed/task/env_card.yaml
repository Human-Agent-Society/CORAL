    models:
      claude-sonnet-4:               {in: 2.2850, out: 1.8929, cached: 2.2850}
      deepseek-r1-0528:              {in: 0.6895, out: 5.4418, cached: 0.6895, decode_tps: 25}
      deepseek-v3-0324:              {in: 0.2165, out: 0.1672, cached: 0.2165}
      deepseek-v3.1-terminus:        {in: 0.4053, out: 0.3008, cached: 0.4053}
