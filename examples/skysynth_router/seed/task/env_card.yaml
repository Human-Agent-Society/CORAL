      gemini-2.5-flash:              {in: 0.0257, out: 6.8629, cached: 0.0257}
      gemini-2.5-pro:                {in: 0.4991, out: 27.4787, cached: 0.4991, decode_tps: 55}
      glm-4.6:                       {in: 0.6927, out: 7.9806, cached: 0.6927}
      gpt-5:                         {in: 1.5479, out: 13.9825, cached: 1.5479, decode_tps: 55}
      intern-s1:                     {in: 0.3387, out: 1.1283, cached: 0.3387}
