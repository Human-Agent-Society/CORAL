name: Release

on:
  push:
    tags:
      - "v*"
  # Allow the promotion workflow to invoke this build+release job directly.
  # A tag pushed with the default GITHUB_TOKEN does not trigger the `push:
  # tags` event above, so the caller passes the new tag explicitly.
  workflow_call:
    inputs:
      tag:
        description: >-
          Tag to release. Required when called by the promotion workflow,
          where github.ref points at a branch and the release action cannot
          infer the tag on its own.
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the package version from git history, so we need
          # the full history (including tags) — not a shallow clone.
          fetch-depth: 0
          # On a tag push github.ref already points at the tag; when called
          # with an explicit tag, check that tag out so hatch-vcs derives the
          # released version rather than the branch head.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - uses: softprops/action-gh-release@v2
        with:
          # Fall back to github.ref_name on a tag push; use the passed tag when
          # invoked from a non-tag event, where the action can't infer it.
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
