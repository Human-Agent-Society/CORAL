task:
  name: "Hard Active Modular Landscape"
  description: |
    Maintain sixteen 16-bit modules in a 256-bit literal CANDIDATE and select
    one module with ACTIVE_MODULE. The task-specific config supplies smooth or
    rugged feedback while the operator scores only provenance-backed assembly.
  tips: |
    - CANDIDATE must be exactly 256 binary digits and ACTIVE_MODULE must be 0..15.
    - Only the selected module is scored.

grader:
  entrypoint: "hard_active_modular_landscape_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  private:
    - "taskdata/hard_seed_bundle.json"
  args:
    program_file: "candidate.py"
    seed_bundle_file: "hard_seed_bundle.json"
    seed_index: 0
    mode: "smooth"

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local

islands:
  count: 2
  migration:
    enabled: true
    every: 64
    rank_window: 64
    min_evals: 1
    max_per_cycle: 2
    remigration_cooldown: 16
