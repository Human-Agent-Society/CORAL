task:
  name: "Hard Active Modular Landscape v5 — Smooth 1024"
  description: |
    Maintain a 1024-bit artifact as 32 literal 32-bit modules. Each real
    evaluation scores only ACTIVE_MODULE against a private Hamming target.
    This is a high-dimensional separable control; the threshold ladder is
    designed to distinguish feedback starvation from topology effects.
  tips: |
    - CANDIDATE should be a tuple/list of 32 literal 32-bit strings.
    - ACTIVE_MODULE must be an integer from 0 through 31.
    - One all-zero probe and one single-bit probe per position identify a
      module, but an additional exact submission is needed for provenance.
    - Use ordinary coral eval only; tune mode is disabled.

grader:
  entrypoint: "hard_active_modular_landscape_v5_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 30
  private:
    - "taskdata/hard_v5_seed_bundle.json"
  args:
    program_file: "candidate.py"
    seed_bundle_file: "hard_v5_seed_bundle.json"
    seed_index: 0
    mode: "smooth"
  direction: maximize

agents:
  count: 4
  runtime: opencode
  model: mafia/glm-5.2
  research: false
  runtime_options:
    role_file: "../../hard_v5_eval_protocol.md"
  sandbox:
    enabled: true
    provider: srt
    network: open

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local
  stop:
    max_real_attempts: 1536

islands:
  count: 2
  migration:
    enabled: true
    every: 64
    rank_window: 64
    min_evals: 1
    max_per_cycle: 2
    remigration_cooldown: 16
