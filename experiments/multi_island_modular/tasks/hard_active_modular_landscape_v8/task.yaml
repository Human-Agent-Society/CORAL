task:
  name: "Certified Modular Landscape v8 — default Smooth"
  description: |
    Maintain a 1024-bit artifact as 32 literal 32-bit modules. Ordinary
    evaluations score one ACTIVE_MODULE. An exact active evaluation returns a
    portable certificate bound to the hidden seed, mode, module index, and
    exact bits. The primary research outcome is the best certificate-backed
    artifact actually submitted by an agent.
  tips: |
    Keep CANDIDATE and CERTIFICATES as literal 32-entry tuples. Copy a returned
    certificate only beside the exact module bits that produced it. Merge
    locally visible certified modules before each submission. Tune is disabled.

grader:
  entrypoint: "hard_active_modular_landscape_v8_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 30
  private:
    - "taskdata/hard_v8_seed_bundle.json"
  args:
    program_file: "candidate.py"
    seed_bundle_file: "hard_v8_seed_bundle.json"
    seed_index: 0
    mode: "smooth"
  direction: maximize

agents:
  count: 4
  runtime: opencode
  model: mafia/glm-5.2
  research: false
  runtime_options:
    role_file: "../../hard_v8_eval_protocol.md"
  sandbox:
    enabled: true
    provider: srt
    network: allowlist

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local
  stop:
    max_real_attempts: 1536

islands:
  count: 2
  migration:
    enabled: true
    every: 128
    rank_window: 128
    min_evals: 1
    max_per_cycle: 2
    remigration_cooldown: 128
