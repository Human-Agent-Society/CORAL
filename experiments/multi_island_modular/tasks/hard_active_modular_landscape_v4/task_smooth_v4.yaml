task:
  name: "Hard Active Modular Landscape v4 — Smooth 576"
  description: |
    Maintain a 576-bit artifact as 24 literal 24-bit modules. Each real
    evaluation scores only ACTIVE_MODULE against a private Hamming target.
    Preserve exact tested modules and their provenance while searching others.
  tips: |
    - CANDIDATE should be a tuple/list of 24 literal 24-bit strings.
    - ACTIVE_MODULE must be an integer from 0 through 23.
    - One all-zero probe and one single-bit probe per position is a
      conservative coordinate baseline, not an upper bound on agent skill.
    - Use ordinary coral eval only; tune mode is disabled.

grader:
  entrypoint: "hard_active_modular_landscape_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 30
  private:
    - "taskdata/hard_v4_seed_bundle.json"
  args:
    program_file: "candidate.py"
    seed_bundle_file: "hard_v4_seed_bundle.json"
    seed_index: 0
    mode: "smooth"
  direction: maximize

agents:
  count: 4
  runtime: opencode
  model: mafia/glm-5.2
  research: false
  runtime_options:
    role_file: "../../hard_v4_eval_protocol.md"
  sandbox:
    enabled: true
    provider: srt
    network: open

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local
  stop:
    max_real_attempts: 768

islands:
  count: 2
  migration:
    enabled: true
    every: 32
    rank_window: 32
    min_evals: 1
    max_per_cycle: 2
    remigration_cooldown: 16
