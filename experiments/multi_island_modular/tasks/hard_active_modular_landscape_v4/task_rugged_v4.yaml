task:
  name: "Hard Active Modular Landscape v4 — Rugged 12,288"
  description: |
    Maintain a 576-bit artifact as 24 literal 24-bit modules. Each real
    evaluation scores only ACTIVE_MODULE. The private target is one of 512
    entries in a public codebook; non-target proposals have no gradient and
    the public all-zero code is a deceptive trap. Targets are unique within a
    repetition, so a discovered module cannot silently duplicate another.
  tips: |
    - CANDIDATE should be a tuple/list of 24 literal 24-bit strings.
    - ACTIVE_MODULE must be an integer from 0 through 23.
    - The codebook construction is public and can be enumerated, but the
      target permutation and seed are private.
    - Use a distinct, agent-specific enumeration offset and record it in a
      note; avoid repeating a failed (module, code) pair.
    - Use ordinary coral eval only; tune mode is disabled.

grader:
  entrypoint: "hard_active_modular_landscape_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 30
  private:
    - "taskdata/hard_v4_seed_bundle.json"
  args:
    program_file: "candidate.py"
    seed_bundle_file: "hard_v4_seed_bundle.json"
    seed_index: 0
    mode: "rugged"
  direction: maximize

agents:
  count: 4
  runtime: opencode
  model: mafia/glm-5.2
  research: false
  runtime_options:
    role_file: "../../hard_v4_eval_protocol.md"
  sandbox:
    enabled: true
    provider: srt
    network: open

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local
  stop:
    max_real_attempts: 8192

islands:
  count: 2
  migration:
    enabled: true
    every: 64
    rank_window: 64
    min_evals: 1
    max_per_cycle: 2
    remigration_cooldown: 16
