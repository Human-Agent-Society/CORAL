task:
  name: "Replicated Institutional Landscape v2 — Rugged N128 K12"
  description: |
    Optimize a literal 128-bit candidate on a private-seed adjacent K=12 NK
    landscape. This is the held-out, medium-ruggedness boundary/diversity
    track; it is separate from the certified component-transfer experiment.
  tips: |
    CANDIDATE must remain one literal 128-bit string. Use ordinary coral eval
    only. The seed is a private 256-bit token and sandbox networking is closed.

grader:
  entrypoint: "institutional_landscape_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 30
  direction: maximize
  private:
    - "taskdata/rugged128_k12_replicated_v2.json"
  args:
    program_file: "candidate.py"
    landscape_file: "rugged128_k12_replicated_v2.json"
    seed_index: 0

agents:
  count: 8
  runtime: opencode
  model: mafia/glm-5.2
  research: false
  runtime_options:
    role_file: "../../threshold_v2_protocol.md"
  sandbox:
    enabled: true
    provider: srt
    network: allowlist

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local
  stop:
    max_real_attempts: 4096

islands:
  count: 4
  migration:
    enabled: true
    every: 512
    rank_window: 512
    min_evals: 1
    dest_weighting: round_robin
    max_per_cycle: 4
    remigration_cooldown: 512
