task:
  name: "Replicated Institutional Landscape v2 — Smooth N128 K0"
  description: |
    Optimize a literal 128-bit candidate on a private-seed K=0 NK landscape.
    This replicated, budget-scaled control tests coordination overhead and
    boundary effects when the landscape has one one-bit local optimum.
  tips: |
    CANDIDATE must remain one literal 128-bit string. Use ordinary coral eval
    only. The seed is a private 256-bit token; networking permits only the model API.

grader:
  entrypoint: "institutional_landscape_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  timeout: 30
  direction: maximize
  private:
    - "taskdata/smooth128_replicated_v2.json"
  args:
    program_file: "candidate.py"
    landscape_file: "smooth128_replicated_v2.json"
    seed_index: 0

agents:
  count: 8
  runtime: opencode
  model: mafia/glm-5.2
  research: false
  runtime_options:
    role_file: "../../threshold_v2_protocol.md"
  sandbox:
    enabled: true
    provider: srt
    network: allowlist
    allowed_domains:
      - api.appintheloop.com

workspace:
  results_dir: "/var/tmp/coral-institutions-results"
  repo_path: "./seed"

run:
  session: local
  stop:
    max_real_attempts: 4096

islands:
  count: 4
  migration:
    enabled: true
    every: 512
    rank_window: 512
    min_evals: 1
    dest_weighting: round_robin
    max_per_cycle: 4
    remigration_cooldown: 512
