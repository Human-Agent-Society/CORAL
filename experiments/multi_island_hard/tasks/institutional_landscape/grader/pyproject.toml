[project]
name = "institutional-landscape-hard-grader"
version = "0.1.0"
description = "Grader for the harder NK landscape ladder."
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_landscape_grader"]
