[project]
name = "scaling-poly-grader"
version = "0.1.0"
description = "Private local evaluator for the CORAL scaling experiment's Frontier-CS task."
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaling_poly_grader"]
