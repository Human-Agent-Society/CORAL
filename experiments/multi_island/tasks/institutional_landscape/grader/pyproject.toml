[project]
name = "institutional-landscape-grader"
version = "0.1.0"
description = "Deterministic NK-landscape grader for the multi-island experiment."
requires-python = ">=3.11"
dependencies = ["coral"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_landscape_grader"]
